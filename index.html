<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b2430">
<title>Ajito AI ソムリエ</title>
<style>
:root{--cream:#f7f0e5;--paper:#fffaf2;--ink:#211c18;--wine:#7b2430;--wine2:#a43d4a;--gold:#b99055;--line:#e8dcc9;--muted:#796f65}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#eee5d8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button{font:inherit}.app{max-width:520px;min-height:100vh;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(60,42,28,.12)}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:radial-gradient(#614d3a .5px,transparent .5px);background-size:7px 7px}
.screen{display:none;min-height:100vh;padding:24px 20px 34px;position:relative;z-index:1}.screen.active{display:flex;flex-direction:column}
.hero{justify-content:center;text-align:center;padding-top:34px}.logo{width:112px;height:112px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.10))}
.kicker{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800}h1{font-family:Georgia,"Yu Mincho",serif;font-size:40px;line-height:1.08;margin:9px 0 10px}h1 b{color:var(--wine)}
.lead{font-family:"Yu Mincho",serif;font-size:20px;line-height:1.55;margin:8px 0}.sub{font-size:14px;color:var(--muted);line-height:1.7;margin:0 auto 22px;max-width:390px}
.routegrid{display:grid;gap:12px;margin:8px 0 22px}.route{border:1px solid var(--line);background:#fffdf9;border-radius:20px;padding:18px;text-align:left;box-shadow:0 8px 22px rgba(64,46,34,.06)}
.route b{display:block;font-family:Georgia,"Yu Mincho",serif;font-size:20px;margin-bottom:4px}.route small{color:var(--muted);line-height:1.5}.route .r-emoji{font-size:30px;float:right;margin-left:10px}
.note{font-size:10px;color:#94887c;margin-top:12px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fffdf9}.steptext{font-size:11px;font-weight:900;color:var(--wine);letter-spacing:.12em}
.progress{height:6px;background:#eadfce;border-radius:999px;overflow:hidden;margin:0 0 26px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:999px;transition:.25s}
.question{font-family:Georgia,"Yu Mincho",serif;font-size:28px;line-height:1.35;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6}
.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#fffdf9;border-radius:17px;padding:15px;text-align:left;display:flex;align-items:center;gap:13px;min-height:68px;box-shadow:0 5px 16px rgba(64,46,34,.04)}
.emoji{font-size:25px;width:36px;text-align:center}.opt strong{display:block;font-size:14px;margin-bottom:2px}.opt small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.categories{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:8px 11px;font-size:11px}.cat.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.foodlist{display:grid;gap:9px}.foodbtn{border:1px solid var(--line);background:#fffdf9;border-radius:15px;padding:14px;text-align:left}.foodbtn strong{display:block;font-size:14px}.foodbtn small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.resultHead{text-align:center;padding-top:8px}.badge{display:inline-block;border:1px solid #d7b4b8;color:var(--wine);border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.15em;padding:6px 9px}
.resultTitle{font-family:Georgia,"Yu Mincho",serif;font-size:29px;margin:10px 0 8px}.resultIntro{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:16px}
.cards{display:grid;gap:13px}.card{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px rgba(55,38,27,.06)}.card.best{border:2px solid var(--wine)}
.bestlabel{display:inline-block;background:var(--wine);color:#fff;font-size:9px;font-weight:900;letter-spacing:.12em;border-radius:999px;padding:5px 8px;margin-bottom:8px}
.type{color:var(--gold);font-weight:900;font-size:10px;letter-spacing:.1em}.name{font-family:Georgia,"Yu Mincho",serif;font-size:20px;margin:4px 0}.meta{font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{background:#f4ebe3;color:#6c4842;border-radius:999px;padding:5px 8px;font-size:10px}
.reason{border-top:1px dashed var(--line);padding-top:10px;font-size:12px;line-height:1.75}.price{margin-top:8px;color:var(--wine);font-weight:900}
.pairfoods{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.pairfoods b{font-size:11px;color:var(--wine)}.pairfoods ul{padding-left:18px;margin:7px 0 0}.pairfoods li{font-size:11px;line-height:1.6}
.retry{margin-top:18px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--wine2),#641722);color:#fff;font-weight:800;padding:16px;width:100%}
.footerbrand{margin-top:auto;padding-top:24px;font-size:10px;color:#9a8e82;text-align:center}
</style>
</head>

let mode=null,step=1,foodCat='Tapas'; const ans={food:null,taste:null,budget:null,winecat:null,serve:null};
const tasteOpts=[['fresh','🌿','すっきり','爽やか・軽やか・酸がきれい'],['fruity','🍓','フルーティー','果実味をしっかり感じたい'],['rich','🍫','濃厚','コク・ボリューム・樽感'],['spicy','🌶️','スパイシー','香り・余韻・複雑さ'],['sweet','🍯','甘め','やさしい甘さ・飲みやすさ']];
const serveOpts=[['glass','🍷','グラスで気軽に','まず1杯試してみたい'],['bottle','🍾','ボトルでじっくり','食事と合わせて楽しみたい'],['either','✨','どちらでもOK','相性を最優先で選びたい']];
const wineCatOpts=[['泡','🥂','スパークリング','乾杯・爽快・華やか'],['白','🥂','白ワイン','魚介・軽やか・香り'],['赤','🍷','赤ワイン','肉・コク・余韻'],['all','✨','色はおまかせ','全部から選ぶ']];
const bottleBudget=[['3000','¥','〜3,980円','気軽に楽しみたい'],['5000','¥','4,000〜5,980円','少し良い1本'],['8000','¥','6,000〜8,980円','特別感のある1本'],['premium','✨','価格より相性重視','AIにおまかせ']];
const glassBudget=[['700','¥','〜680円','気軽に1杯'],['900','¥','780〜880円','ちょっと良い1杯'],['premium','✨','価格より相性重視','AIにおまかせ']];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function startMode(m){mode=m;step=1;Object.keys(ans).forEach(k=>ans[k]=null);renderStep();show('quiz')}
function prevStep(){if(step===1){show('home');return}step--;renderStep();window.scrollTo(0,0)}
function restart(){mode=null;show('home')}
function renderStep(){document.getElementById('stepText').textContent=`STEP ${step} / 4`;document.getElementById('bar').style.width=`${step/4*100}%`;if(mode==='food'){if(step===1)renderFoodPicker();if(step===2)renderSimple('今日はどう楽しみますか？','グラスかボトルかを選んでください。',serveOpts,'serve');if(step===3)renderSimple('どんなワインが好きですか？','迷ったら直感で選んでOK。',tasteOpts,'taste');if(step===4)renderBudget()}else{if(step===1)renderSimple('今日はどう楽しみますか？','グラスかボトルかを選んでください。',serveOpts,'serve');if(step===2)renderSimple('今日はどのワイン気分？','色を決めず、全部から探すこともできます。',wineCatOpts,'winecat');if(step===3)renderSimple('どんな味が好きですか？','あなたの好みに近い1杯・1本を探します。',tasteOpts,'taste');if(step===4)renderBudget()}}
function renderBudget(){let opts=ans.serve==='glass'?glassBudget:(ans.serve==='bottle'?bottleBudget:[['premium','✨','価格はおまかせ','相性を優先します']]);renderSimple('ご予算は？','最後の質問です。',opts,'budget')}
function renderSimple(q,h,opts,field){document.getElementById('question').innerHTML=`<h2 class="question">${q}</h2><p class="hint">${h}</p>`;document.getElementById('options').innerHTML=opts.map(o=>`<button class="opt" onclick="choose('${field}','${o[0]}')"><span class="emoji">${o[1]}</span><span><strong>${o[2]}</strong><small>${o[3]}</small></span></button>`).join('')}
function renderFoodPicker(){const cats=[...new Set(foods.map(f=>f.cat))];if(!cats.includes(foodCat))foodCat=cats[0];document.getElementById('question').innerHTML=`<h2 class="question">何を食べますか？</h2><p class="hint">カテゴリーを選んで、料理を1品タップしてください。</p><div class="categories">${cats.map(c=>`<button class="cat ${c===foodCat?'active':''}" onclick="setFoodCat('${c}')">${c}</button>`).join('')}</div>`;renderFoodList()}
function setFoodCat(c){foodCat=c;renderFoodPicker()}
function renderFoodList(){const arr=foods.filter(f=>f.cat===foodCat);document.getElementById('options').innerHTML=`<div class="foodlist">${arr.map(f=>`<button class="foodbtn" onclick="chooseFood('${f.id}')"><strong>${f.name}</strong><small>${f.note}</small></button>`).join('')}</div>`}
function chooseFood(id){ans.food=id;step=2;renderStep();window.scrollTo(0,0)}
function choose(field,val){ans[field]=val;if(step<4){step++;renderStep();window.scrollTo(0,0)}else renderResult()}
function candidates(){return ans.serve==='glass'?glassWines:(ans.serve==='bottle'?wines:[...glassWines,...wines])}
function budgetScore(p,b,serve){if(!b||b==='premium')return 0;if(serve==='グラス'){if(b==='700')return p<=680?5:-3;if(b==='900')return p>=780&&p<=880?5:-2}if(b==='3000')return p<=3980?5:p<=4980?1:-5;if(b==='5000')return p>=3980&&p<=5980?5:p<=6980?1:-3;if(b==='8000')return p>=5980&&p<=8980?5:p>=4980?1:-3;return 0}
function tasteScore(w,t){if(t==='fresh')return w.acid*1.5+(6-w.body)+w.bubble*.6;if(t==='fruity')return w.fruit*1.8+(w.sweet>=2?2:0);if(t==='rich')return w.body*1.8+w.oak*.8+w.fruit*.5;if(t==='spicy')return w.spice*2+w.body*.6;if(t==='sweet')return w.sweet*2.2+w.fruit*.6;return 0}
function pairScore(w,f){let s=8-Math.abs(w.body-f.body)*1.4+7-Math.abs(w.acid-f.acidNeed)*1.15;if(f.tags.includes('seafood')){if(w.cat==='白')s+=5;if(w.cat==='泡')s+=4}if(f.tags.includes('beef')||f.tags.includes('lamb')){if(w.cat==='赤')s+=6;if(w.body>=4)s+=3}if(f.tags.includes('pork')){if(w.cat==='赤'&&w.body<=4)s+=3;if(w.cat==='白'&&w.body>=3)s+=2;if(w.cat==='泡')s+=2}if(f.tags.includes('fried'))s+=w.acid*.7+w.bubble*.8;if(['cream','butter','cheese','rich'].some(t=>f.tags.includes(t))){s+=w.acid*.55+w.body*.6;if(w.oak>=2)s+=1.5}if(f.tags.includes('tomato')){if(w.cat==='赤')s+=2.5;if(w.acid>=4)s+=2}if(f.tags.includes('truffle')||f.tags.includes('mushroom')){if(w.cat==='赤')s+=2;if(w.body>=3)s+=2;if(w.oak>=2)s+=1}if(f.tags.includes('spice')){if(w.fruit>=4)s+=2;if(w.spice>=3)s+=1.5;if(w.sweet>=2)s+=1}if(['lemon','fresh','mineral'].some(t=>f.tags.includes(t))){if(w.acid>=4)s+=3;if(w.cat==='白'||w.cat==='泡')s+=2}if(f.tags.includes('sweet')||f.tags.includes('dessert')){s+=w.sweet*1.7+w.fruit*.7;if(w.sweet<2)s-=2}if(f.tags.includes('salty'))s+=w.acid*.5+w.bubble*.5;return s}
function wineReason(w,f){const p=[];if(w.cat==='泡')p.push('泡の爽快感が口の中をリセット');if(w.cat==='白'&&w.acid>=4)p.push('きれいな酸が料理の輪郭を引き立てる');if(w.cat==='赤'&&w.body>=4)p.push('しっかりしたボディが料理の旨味に負けない');if(w.fruit>=4)p.push('豊かな果実味が味わいをふくらませる');if(w.spice>=3)p.push('スパイス感が香ばしさや余韻に寄り添う');if(w.oak>=3)p.push('樽由来のコクが濃厚さと好相性');if(w.sweet>=3)p.push('やさしい甘みが塩味や辛味を包み込む');return `${f.name}には、${p.slice(0,2).join('、')}のがポイント。${w.desc}`}
function foodReason(w,f){const p=[];if(f.tags.includes('seafood'))p.push('魚介の旨味');if(f.tags.includes('beef'))p.push('赤身肉のコク');if(f.tags.includes('cream'))p.push('クリームの濃厚さ');if(f.tags.includes('truffle'))p.push('トリュフの香り');if(f.tags.includes('spice'))p.push('スパイスの余韻');if(f.tags.includes('tomato'))p.push('トマトの酸味');if(f.tags.includes('cheese'))p.push('チーズのコク');if(f.tags.includes('fresh'))p.push('爽やかな味わい');return `${w.name}の「${w.tags.slice(0,2).join('・')}」な個性が、${(p.slice(0,2).join('と')||'料理の味わい')}と自然につながります。`}
function rankWines(){const f=foods.find(x=>x.id===ans.food);return candidates().map(w=>({w,score:pairScore(w,f)+tasteScore(w,ans.taste)+budgetScore(w.price,ans.budget,w.serve)})).sort((a,b)=>b.score-a.score).slice(0,3)}
function rankByPref(){return candidates().filter(w=>ans.winecat==='all'||w.cat===ans.winecat).map(w=>({w,score:tasteScore(w,ans.taste)+budgetScore(w.price,ans.budget,w.serve)+(ans.winecat!=='all'?2:0)})).sort((a,b)=>b.score-a.score).slice(0,3)}
function topFoodsFor(w){return foods.map(f=>({f,score:pairScore(w,f)})).sort((a,b)=>b.score-a.score).slice(0,3)}
function renderResult(){const cards=document.getElementById('cards');if(mode==='food'){const f=foods.find(x=>x.id===ans.food),top=rankWines();document.getElementById('resultTitle').textContent='おすすめワイン TOP3';document.getElementById('resultIntro').textContent=`「${f.name}」に合わせて選びました。`;cards.innerHTML=top.map((x,i)=>`<article class="card ${i===0?'best':''}">${i===0?'<span class="bestlabel">BEST MATCH</span>':''}<div class="type">${x.w.serve} · ${x.w.cat==='泡'?'SPARKLING':x.w.cat==='白'?'WHITE WINE':'RED WINE'}</div><div class="name">${x.w.name}</div><div class="meta">${x.w.grape} / ${x.w.country}</div><div class="tags">${x.w.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="reason">${wineReason(x.w,f)}</div><div class="price">${x.w.serve==='グラス'?'Glass':'Bottle'} ¥${x.w.price.toLocaleString()}</div></article>`).join('')}else{const top=rankByPref();document.getElementById('resultTitle').textContent='あなた向けの3本';document.getElementById('resultIntro').textContent='好みと予算から選びました。各ワインに合うAjito料理もご提案します。';cards.innerHTML=top.map((x,i)=>{const pf=topFoodsFor(x.w);return `<article class="card ${i===0?'best':''}">${i===0?'<span class="bestlabel">BEST MATCH</span>':''}<div class="type">${x.w.serve} · ${x.w.cat==='泡'?'SPARKLING':x.w.cat==='白'?'WHITE WINE':'RED WINE'}</div><div class="name">${x.w.name}</div><div class="meta">${x.w.grape} / ${x.w.country}</div><div class="tags">${x.w.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="reason">${x.w.desc}</div><div class="price">${x.w.serve==='グラス'?'Glass':'Bottle'} ¥${x.w.price.toLocaleString()}</div><div class="pairfoods"><b>このワインに合う料理 TOP3</b><ul>${pf.map(y=>`<li><strong>${y.f.name}</strong><br>${foodReason(x.w,y.f)}</li>`).join('')}</ul></div></article>`}).join('')}show('result')}
</script></body></html>
