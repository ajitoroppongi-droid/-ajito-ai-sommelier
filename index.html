<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b2430">
<title>Ajito AI ソムリエ</title>
<style>
:root{--cream:#f7f0e5;--paper:#fffaf2;--ink:#211c18;--wine:#7b2430;--wine2:#a43d4a;--gold:#b99055;--line:#e8dcc9;--muted:#796f65;}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#eee5d8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button{font:inherit}.app{max-width:520px;min-height:100vh;margin:0 auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(60,42,28,.12)}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:radial-gradient(#614d3a .5px,transparent .5px);background-size:7px 7px}
.screen{display:none;min-height:100vh;padding:24px 20px 34px;position:relative;z-index:1}.screen.active{display:flex;flex-direction:column}
.hero{justify-content:center;text-align:center;padding-top:34px}.logo{width:112px;height:112px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.10))}
.kicker{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800}h1{font-family:Georgia,"Yu Mincho",serif;font-size:40px;line-height:1.08;margin:9px 0 10px}h1 b{color:var(--wine)}
.lead{font-family:"Yu Mincho",serif;font-size:20px;line-height:1.55;margin:8px 0 8px}.sub{font-size:14px;color:var(--muted);line-height:1.7;margin:0 auto 24px;max-width:390px}
.pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 26px}.pill{border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:7px 10px;font-size:11px;color:#5d5148}
.primary{border:0;border-radius:16px;background:linear-gradient(135deg,var(--wine2),#641722);color:#fff;font-weight:800;padding:17px 18px;width:100%;box-shadow:0 12px 26px rgba(123,36,48,.20)}.note{font-size:10px;color:#94887c;margin-top:12px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fffdf9}.steptext{font-size:11px;font-weight:900;color:var(--wine);letter-spacing:.12em}.progress{height:6px;background:#eadfce;border-radius:999px;overflow:hidden;margin:0 0 28px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:999px;transition:.25s}
.question{font-family:Georgia,"Yu Mincho",serif;font-size:29px;line-height:1.35;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6}
.options{display:grid;gap:11px}.opt{border:1px solid var(--line);background:#fffdf9;border-radius:17px;padding:17px;text-align:left;display:flex;align-items:center;gap:14px;min-height:74px;box-shadow:0 6px 18px rgba(64,46,34,.04)}.opt:active{transform:scale(.99)}.emoji{font-size:27px;width:38px;text-align:center}.opt strong{display:block;font-size:15px;margin-bottom:3px}.opt small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.resultHead{text-align:center;padding-top:12px}.badge{display:inline-block;border:1px solid #d7b4b8;color:var(--wine);border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.15em;padding:6px 9px}.resultTitle{font-family:Georgia,"Yu Mincho",serif;font-size:30px;margin:10px 0 8px}.resultIntro{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:18px}
.cards{display:grid;gap:13px}.card{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px rgba(55,38,27,.06)}.card.best{border:2px solid var(--wine);position:relative}.bestlabel{display:inline-block;background:var(--wine);color:white;font-size:9px;font-weight:900;letter-spacing:.12em;border-radius:999px;padding:5px 8px;margin-bottom:8px}.type{color:var(--gold);font-weight:900;font-size:10px;letter-spacing:.12em}.name{font-family:Georgia,"Yu Mincho",serif;font-size:21px;margin:4px 0}.meta{font-size:11px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{background:#f4ebe3;color:#6c4842;border-radius:999px;padding:5px 8px;font-size:10px}.reason{border-top:1px dashed var(--line);padding-top:10px;font-size:12px;line-height:1.75}.price{margin-top:8px;color:var(--wine);font-weight:900}.retry{margin-top:18px}
.footerbrand{margin-top:auto;padding-top:24px;font-size:10px;color:#9a8e82;text-align:center}
</style>
</head>

{field:'occasion',q:'今日は誰と楽しみますか？',hint:'シーンに合う雰囲気のワインを選びます。',opts:[['date','❤️','デート','ちょっと特別な1本'],['celebration','🥂','記念日','華やかに乾杯'],['friends','👭','友人・女子会','みんなで楽しく'],['solo','🍷','ひとり飲み','じっくり味わう']]},
{field:'dish',q:'一緒に食べたい料理は？',hint:'Ajitoの人気メニューから選んでください。',opts:[['caprese','🍅','ホワイトカプレーゼ','モッツァレラ × トマト'],['steak','🥩','牛ハラミステーキ','赤身肉 × トリュフソース'],['stew','🍳','牛スジシチュー','焦がしチーズ × 半熟卵'],['omelette','🦀','イクラとカニの贅沢スフレオムレツ','濃厚クリーム × 海の幸'],['pasta','🍝','ブラックペペロンチーノ','チーズ × ブラックペッパー'],['carpaccio','🐟','真鯛のカルパッチョ','夏野菜 × ガスパチョ']]},
{field:'taste',q:'どんな味が好きですか？',hint:'迷ったら直感で選んでOK。',opts:[['fresh','🌿','すっきり','爽やか・軽やか'],['fruity','🍓','フルーティー','果実味たっぷり'],['rich','🍫','濃厚','コク・ボリューム'],['spicy','🌶️','スパイシー','香り・余韻を楽しむ']]},
{field:'budget',q:'ボトルのご予算は？',hint:'最後の質問です。',opts:[['3000','¥','〜3,980円くらい','気軽に楽しむ'],['5000','¥','4,000〜5,980円くらい','ちょっといい1本'],['8000','¥','6,000〜8,000円くらい','特別感のある1本'],['premium','✨','価格よりおすすめ重視','AIにおまかせ']]},
];
const labels={dish:{caprese:'ホワイトカプレーゼ',steak:'牛ハラミステーキ',stew:'牛スジシチュー',omelette:'贅沢スフレオムレツ',pasta:'ブラックペペロンチーノ',carpaccio:'真鯛のカルパッチョ'},taste:{fresh:'すっきり',fruity:'フルーティー',rich:'濃厚',spicy:'スパイシー'}};
const wines=[
{name:'ポール・メッサー',type:'スパークリング',meta:'Brut / France',price:2980,tastes:['fresh','fruity'],dishes:['caprese','omelette','carpaccio'],occasions:['celebration','date','friends'],tags:['爽やか','泡','乾杯']},
{name:'ランブルスコ',type:'スパークリング',meta:'Lambrusco / Italy',price:2980,tastes:['fruity'],dishes:['stew','pasta'],occasions:['friends','date'],tags:['赤泡','果実味','軽快']},
{name:'ミオネット プロセッコ',type:'スパークリング',meta:'Prosecco / Italy',price:4980,tastes:['fresh','fruity'],dishes:['caprese','omelette','carpaccio'],occasions:['celebration','date'],tags:['華やか','爽快','乾杯']},
{name:'ローラン・ペリエ',type:'シャンパーニュ',meta:'Champagne / France',price:7980,tastes:['fresh'],dishes:['caprese','omelette','carpaccio'],occasions:['celebration','date'],tags:['上品','キレ','特別感']},
{name:'EST レゼルヴァ ソーヴィニヨン・ブラン',type:'白ワイン',meta:'Sauvignon Blanc / Chile',price:3980,tastes:['fresh'],dishes:['caprese','carpaccio'],occasions:['date','friends','solo'],tags:['爽やか','柑橘','ハーブ']},
{name:'ダークホース シャルドネ',type:'白ワイン',meta:'Chardonnay / California',price:3980,tastes:['rich','fruity'],dishes:['omelette','stew'],occasions:['date','friends','solo'],tags:['コク','まろやか','果実味']},
{name:'ワイルド・ネイチャー ピノ・グリージョ',type:'白ワイン',meta:'Pinot Grigio / Italy',price:3980,tastes:['fresh'],dishes:['caprese','carpaccio'],occasions:['friends','solo'],tags:['軽快','辛口','食中酒']},
{name:'ブレッド＆バター シャルドネ',type:'白ワイン',meta:'Chardonnay / California',price:7980,tastes:['rich','fruity'],dishes:['omelette','stew'],occasions:['celebration','date','solo'],tags:['濃厚','樽感','リッチ']},
{name:'グース・バンプ',type:'赤ワイン',meta:"Nero d'Avola / Italy",price:2980,tastes:['fruity','spicy'],dishes:['steak','pasta','stew'],occasions:['friends','date'],tags:['果実味','スパイス','親しみやすい']},
{name:'キリビンビン',type:'赤ワイン',meta:'Shiraz / Australia',price:3980,tastes:['rich','spicy'],dishes:['steak','stew'],occasions:['friends','solo','date'],tags:['濃厚','スパイス','肉料理']},
{name:'キャンティ・リゼルヴァ',type:'赤ワイン',meta:'Sangiovese / Italy',price:5980,tastes:['spicy','fruity'],dishes:['steak','pasta'],occasions:['date','celebration','solo'],tags:['酸味','香り','イタリア']},
{name:'カイケン',type:'赤ワイン',meta:'Cabernet Sauvignon / Argentina',price:6980,tastes:['rich','spicy'],dishes:['steak','stew'],occasions:['celebration','date','solo'],tags:['フルボディ','余韻','特別感']}
];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function startQuiz(){step=1;renderStep();show('quiz')}
function renderStep(){const s=steps[step-1];document.getElementById('stepText').textContent=`STEP ${step} / 4`;document.getElementById('bar').style.width=`${step*25}%`;document.getElementById('question').innerHTML=`<h2 class="question">${s.q}</h2><p class="hint">${s.hint}</p>`;document.getElementById('options').innerHTML=s.opts.map(o=>`<button class="opt" onclick="choose('${o[0]}')"><span class="emoji">${o[1]}</span><span><strong>${o[2]}</strong><small>${o[3]}</small></span></button>`).join('')}
function choose(v){const s=steps[step-1];answers[s.field]=v;if(step<4){step++;renderStep();window.scrollTo(0,0)}else renderResult()}
function prevStep(){if(step===1){show('home');return}step--;renderStep();window.scrollTo(0,0)}
function budgetScore(p,b){if(b==='premium')return 1;if(b==='3000')return p<=3980?3:p<=4980?1:-2;if(b==='5000')return p>=3980&&p<=5980?3:p<=6980?1:-1;if(b==='8000')return p>=5980&&p<=8000?3:p>=4980?1:-1;return 0}
function score(w){let s=0;if(w.dishes.includes(answers.dish))s+=6;if(w.tastes.includes(answers.taste))s+=4;if(w.occasions.includes(answers.occasion))s+=2;s+=budgetScore(w.price,answers.budget);return s}
function reason(w){let x=`${labels.dish[answers.dish]}に合わせやすく、${labels.taste[answers.taste]}なワインが好きな方におすすめ。`;if(w.type.includes('スパークリング')||w.type.includes('シャンパーニュ'))x+=' 泡の爽快感が料理の余韻をすっきり整えます。';else if(w.type==='白ワイン')x+=' 酸味と果実味が料理のコクや塩味を引き立てます。';else x+=' 果実味とコクが料理の旨味にしっかり寄り添います。';return x}
function renderResult(){const top=[...wines].map(w=>({...w,s:score(w)})).sort((a,b)=>b.s-a.s).slice(0,3);document.getElementById('resultIntro').textContent=`「${labels.dish[answers.dish]}」×「${labels.taste[answers.taste]}」から選びました。`;document.getElementById('cards').innerHTML=top.map((w,i)=>`<article class="card ${i===0?'best':''}">${i===0?'<span class="bestlabel">BEST MATCH</span>':''}<div class="type">${w.type}</div><div class="name">${w.name}</div><div class="meta">${w.meta}</div><div class="tags">${w.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="reason">${reason(w)}</div><div class="price">Bottle ¥${w.price.toLocaleString()}</div></article>`).join('');show('result')}
function restart(){Object.keys(answers).forEach(k=>answers[k]=null);show('home')}
</script>
</body></html>
